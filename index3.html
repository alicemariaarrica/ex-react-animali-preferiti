<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            min-width: 300px;
        }

        .modal-content {
            margin-bottom: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .lista-animali {
            width: 100%;
            max-width: 600px;
            margin-top: 1rem;
        }

        .lista-animali button {
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
            background-color: #2d89ef;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <h1>I miei animali Preferiti</h1>
    </header>

    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale" />
        </figure>

        <!-- Punto in cui viene montato React -->
        <div class="lista-animali"></div>
    </main>

    <footer>
        <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>

    <!-- Librerie React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Codice React -->
    <script type="text/babel">
        const { useState } = React;
        const { createRoot, createPortal } = ReactDOM;

        function Modal({ title, content, show = false, onClose = () => { }, onConfirm = () => { } }) {
            return show && createPortal(
                <div className="modal-container">
                    <div className="modal">
                        <h2>{title}</h2>
                        <div className="modal-content">
                            {content}
                        </div>
                        <div className="modal-buttons">
                            <button onClick={onClose}>Annulla</button>
                            <button onClick={onConfirm}>Conferma</button>
                        </div>
                    </div>
                </div>,
                document.body
            );
        }

        function ListaAnimali() {
            const [animals, setAnimals] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [inputValue, setInputValue] = useState("");

            const handleConfirm = () => {
                if (inputValue.trim() !== "") {
                    setAnimals([...animals, inputValue.trim()]);
                }
                setShowModal(false);
                setInputValue("");
            };

            const modalContent = (
                <input
                    type="text"
                    placeholder="Inserisci un animale"
                    value={inputValue}
                    onChange={(e) => setInputValue(e.target.value)}
                />
            );

            return (
                <div>
                    <button onClick={() => setShowModal(true)}>Aggiungi Animale</button>
                    <details open>
                        <summary>Animali</summary>
                        <ul>
                            {animals.map((animale, index) => (
                                <li key={index}>{animale}</li>
                            ))}
                        </ul>
                    </details>

                    <Modal
                        title="Nuovo Animale"
                        content={modalContent}
                        show={showModal}
                        onClose={() => setShowModal(false)}
                        onConfirm={handleConfirm}
                    />
                </div>
            );
        }

        const root = createRoot(document.querySelector(".lista-animali"));
        root.render(<ListaAnimali />);
    </script>
</body>

</html>
